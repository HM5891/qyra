name: Deploy Qyra AI

on:
  push:
    branches: [main]
    paths: ['supabase/**', '.github/workflows/deploy-ai.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      GROQ: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the 3 secrets are set
        run: |
          missing=0
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || { echo "::error::Missing secret SUPABASE_ACCESS_TOKEN"; missing=1; }
          [ -n "$REF" ] || { echo "::error::Missing secret SUPABASE_PROJECT_REF"; missing=1; }
          [ -n "$GROQ" ] || { echo "::error::Missing secret GROQ_API_KEY"; missing=1; }
          exit $missing
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Create the reply-limit table
        continue-on-error: true
        run: |
          python3 -c 'import json;print(json.dumps({"query":open("supabase/qyra_usage.sql").read()}))' > /tmp/q.json
          code=$(curl -s -o /tmp/out.txt -w '%{http_code}' -X POST "https://api.supabase.com/v1/projects/$REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @/tmp/q.json)
          cat /tmp/out.txt; echo
          if [ "$code" -ge 300 ]; then echo "::warning::Could not run the SQL automatically (HTTP $code). Paste supabase/qyra_usage.sql into Supabase SQL Editor once."; exit 1; fi
      - name: Save the Groq key on Supabase
        run: supabase secrets set GROQ_API_KEY="$GROQ" --project-ref "$REF"
      - name: Deploy the chat function
        run: supabase functions deploy qyra-chat --project-ref "$REF" --no-verify-jwt
      - name: Tell the app where the AI is
        run: |
          printf '{"aiUrl":"https://%s.supabase.co/functions/v1/qyra-chat"}\n' "$REF" > qyra-config.json
          if ! git ls-files --error-unmatch qyra-config.json >/dev/null 2>&1 || ! git diff --quiet -- qyra-config.json; then
            git config user.name "Qyra bot"
            git config user.email "actions@users.noreply.github.com"
            git add qyra-config.json
            git commit -m "Connect the app to Qyra AI"
            git push
          else
            echo "App already points to the AI"
          fi
