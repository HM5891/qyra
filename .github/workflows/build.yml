name: Build Qyra APKs

on:
  push:
    branches: [main]
    paths: ['apps/**', '.github/workflows/build.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: qyra
            label: Qyra
            src: qyra_app
            artifact: qyra-apk
          - id: qyra_admin
            label: Qyra Admin
            src: qyra_admin
            artifact: qyra-admin-apk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create the Android app
        run: |
          flutter create --platforms=android --org com.qyra --project-name ${{ matrix.id }} out
          cp apps/${{ matrix.src }}/main.dart out/lib/main.dart
          cd out
          flutter pub add $(cat ../apps/${{ matrix.src }}/deps.txt)
          python3 ../apps/patch_android.py "${{ matrix.label }}" ../apps/${{ matrix.src }}/icons
      - name: Signing key
        env:
          KS: ${{ secrets.QYRA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/qyra.jks"
            echo "QYRA_KEYSTORE=$RUNNER_TEMP/qyra.jks" >> "$GITHUB_ENV"
            echo "Signing with your permanent Qyra key"
          else
            echo "::warning::No QYRA_KEYSTORE_BASE64 secret yet, so this APK uses a temporary key. Run tools/setup_signing.sh in Termux once."
          fi
      - name: Build APK
        working-directory: out
        env:
          QYRA_KEYSTORE_PASSWORD: ${{ secrets.QYRA_KEYSTORE_PASSWORD }}
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out/build/app/outputs/flutter-apk/app-release.apk
