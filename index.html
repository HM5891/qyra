<style>
/* Layout: photo-first night app. One column max 720px; 2-col photo grid (3 on wide); profile = full-bleed photo stack + detail panels; chat = single column. */
:root{
  --bg:#0d0a0f;--s1:#16111a;--s2:#1f1824;--line:#2d2432;--ink:#f6eff3;--dim:#bcaeb8;--mute:#988a95;
  --accent:#f09ab0;--accent-ink:#2b0d17;--online:#5edc9f;
  --display:'Bodoni Moda','Didot','Times New Roman',serif;--sans:'Manrope',system-ui,-apple-system,sans-serif;
  --r-card:22px;--r-ctl:14px;color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font:500 15px/1.5 var(--sans);-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:var(--bg)}
html.locked,html.locked body{overflow:hidden}
a{color:inherit;text-decoration:none}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ic{width:20px;height:20px;flex:none}
.round{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--s1);display:inline-flex;align-items:center;justify-content:center;position:relative;cursor:pointer;flex:none}
.badge-n{position:absolute;top:-3px;right:-3px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:800;display:grid;place-items:center}
.tag{font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;border-radius:99px;padding:4px 9px;background:rgba(13,10,15,.66);border:1px solid rgba(255,255,255,.16);color:var(--ink)}
/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid transparent}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:12px}
.logo{font:italic 600 30px/1 var(--display);letter-spacing:-.01em;flex:1}
.logo span{color:var(--accent)}
/* search + quick */
.searchrow{display:flex;gap:10px;padding-block:4px 12px}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:10px;height:48px;border-radius:var(--r-ctl);background:var(--s1);border:1px solid var(--line);padding:0 14px;color:var(--mute)}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--ink);font-weight:600;font-size:15px}
.search input::placeholder{color:var(--mute)}
.fbtn{height:48px;border-radius:var(--r-ctl);border:1px solid var(--line);background:var(--s1);padding:0 14px;display:inline-flex;align-items:center;gap:8px;font-weight:700;cursor:pointer;position:relative}
.fbtn.on{border-color:var(--accent);color:var(--accent)}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--s1);border:1px solid var(--line);border-radius:var(--r-ctl);padding:4px;gap:4px}
.seg button{height:38px;border:0;border-radius:10px;background:none;font-weight:700;font-size:14px;color:var(--dim);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--s2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.pills{display:flex;flex-wrap:wrap;gap:6px;padding-top:12px}
.pill{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 6px 0 12px;border-radius:99px;background:var(--s2);border:1px solid var(--line);font-size:13px;font-weight:700;cursor:pointer}
.pill i{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:var(--dim);font-style:normal}
.pill.clear{background:none;border-color:transparent;color:var(--accent);padding:0 8px}
/* online strip */
.h2row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:22px 0 12px}
.h2row h2{margin:0;font:italic 600 24px/1.1 var(--display)}
.h2row span{color:var(--mute);font-size:13px;font-weight:700}
.strip{display:flex;gap:14px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.strip::-webkit-scrollbar{display:none}
.bub{flex:none;width:72px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--dim)}
.ring{width:68px;height:68px;border-radius:50%;padding:3px;background:conic-gradient(var(--online),var(--accent),var(--online))}
.ring>div{width:100%;height:100%;border-radius:50%;overflow:hidden;position:relative;border:2px solid var(--bg)}
/* grid + cards */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:640px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.card{position:relative;display:block;aspect-ratio:3/4;max-width:100%;border-radius:var(--r-card);overflow:hidden;background:var(--s1);isolation:isolate}
.card.off .pic{filter:saturate(.6) brightness(.78)}
.pic{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(120% 90% at 30% 10%,color-mix(in srgb,var(--ac,#f09ab0) 26%,#2a2030),#120e15 72%)}
.ph b{font:italic 600 58px/1 var(--display);color:rgba(246,239,243,.86);transform:translateY(-14%)}
.ring .ph b{font-size:26px;transform:none}
.shade{position:absolute;inset:auto 0 0;height:60%;background:linear-gradient(to top,rgba(10,7,12,.95) 8%,rgba(10,7,12,0));z-index:1;pointer-events:none}
.card .tag{position:absolute;top:10px;left:10px;z-index:2}
.live{position:absolute;top:13px;right:13px;z-index:2;width:11px;height:11px;border-radius:50%;background:var(--online);box-shadow:0 0 0 3px rgba(94,220,159,.22)}
.meta{position:absolute;inset:auto 0 0;z-index:2;padding:12px 13px 13px}
.meta b{display:block;font:italic 600 22px/1.05 var(--display)}
.meta small{display:block;font-size:12.5px;font-weight:600;color:var(--dim);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta .st{color:var(--online)}
.empty{grid-column:1/-1;background:var(--s1);border:1px solid var(--line);border-radius:var(--r-card);padding:28px 18px;text-align:center;color:var(--dim);display:flex;flex-direction:column;gap:12px;align-items:center}
.btn{height:46px;padding:0 18px;border-radius:var(--r-ctl);border:1px solid var(--line);background:var(--s1);font-weight:800;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.foot{padding-block:30px 44px;color:var(--mute);font-size:12.5px;text-align:center}
/* filter sheet */
.scrim{position:fixed;inset:0;z-index:30;background:rgba(5,3,6,.7);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:720px;max-height:88vh;background:var(--s1);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;display:flex;flex-direction:column}
.sheet header{display:flex;align-items:center;justify-content:space-between;padding:16px max(18px,env(safe-area-inset-right,0px)) 10px max(18px,env(safe-area-inset-left,0px))}
.sheet header h2{margin:0;font:italic 600 26px var(--display)}
.sbody{overflow-y:auto;padding:4px max(18px,env(safe-area-inset-right,0px)) 10px max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:22px}
.fs h3{margin:0 0 10px;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{height:40px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--s2);font-weight:700;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.opt small{color:var(--mute);font-weight:700}
.opt[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.opt[aria-pressed="true"] small{color:#6d6070}
.sfoot{display:flex;gap:10px;padding:12px max(18px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));border-top:1px solid var(--line)}
.sfoot .pri{flex:1}
/* profile */
.pf{padding-bottom:116px}
.hero{position:relative;max-width:720px;margin:0 auto}
.slides{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;height:min(74vh,660px)}
.slides::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:start;position:relative;overflow:hidden;background:var(--s1)}
.slide .ph b{font-size:120px}
.bars{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:5px;z-index:3}
.bars i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.3)}.bars i.on{background:#fff}
.hero .round.back{position:absolute;z-index:3;top:calc(26px + env(safe-area-inset-top,0px));left:max(14px,env(safe-area-inset-left,0px));background:rgba(13,10,15,.6);border-color:rgba(255,255,255,.14)}
.hero .tag{position:absolute;z-index:3;top:calc(36px + env(safe-area-inset-top,0px));right:max(14px,env(safe-area-inset-right,0px))}
.hero .shade{height:50%}
.over{position:absolute;inset:auto 0 0;z-index:2;padding:0 max(18px,env(safe-area-inset-right,0px)) 18px max(18px,env(safe-area-inset-left,0px))}
.over h1{margin:0;font:italic 600 46px/1 var(--display);letter-spacing:-.01em}
.over h1 em{font-style:normal;font-weight:600;font-size:32px;color:var(--dim)}
.over p{margin:8px 0 0;color:var(--dim);font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mute);display:inline-block}.dot.on{background:var(--online)}
.panel{display:flex;flex-direction:column;gap:14px;padding-block:18px}
.quote{margin:0;font:italic 500 21px/1.35 var(--display);color:var(--ink)}
.box{background:var(--s1);border:1px solid var(--line);border-radius:var(--r-card);padding:16px;display:flex;flex-direction:column;gap:12px}
.box h3{margin:0;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.box p{margin:0;max-width:62ch;color:var(--ink)}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}
.facts div{min-width:0}.facts small{display:block;font-size:12px;font-weight:700;color:var(--mute)}.facts b{display:block;font-weight:700;overflow-wrap:anywhere}
.moods{display:flex;flex-wrap:wrap;gap:6px}
.moods span{height:32px;display:inline-flex;align-items:center;padding:0 12px;border-radius:99px;background:var(--s2);border:1px solid var(--line);font-size:13px;font-weight:700}
.tog{display:flex;align-items:center;justify-content:space-between;gap:12px}
.tog b{display:block}.tog small{color:var(--dim)}
.sw{width:54px;height:32px;border-radius:99px;border:0;background:var(--s2);box-shadow:inset 0 0 0 1px var(--line);position:relative;cursor:pointer;flex:none}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:var(--mute);transition:left .2s}
.sw[aria-checked="true"]{background:var(--accent);box-shadow:none}.sw[aria-checked="true"]::after{left:26px;background:#fff}
.confirm{background:var(--s2);border:1px solid var(--accent);border-radius:var(--r-card);padding:16px;display:flex;flex-direction:column;gap:10px}
.confirm .row{display:flex;gap:8px;flex-wrap:wrap}
.dock{position:fixed;inset:auto 0 0;z-index:8;background:linear-gradient(to top,var(--bg) 72%,transparent);padding-top:20px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
.dock .wrap{display:flex;gap:10px}
.dock .btn.pri{flex:1;height:54px;font-size:16px}
.fav{width:54px;height:54px;border-radius:var(--r-ctl)}
.fav[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}.fav[aria-pressed="true"] path{fill:var(--accent)}
/* chat */
html.chatmode,html.chatmode body,html.chatmode #app{height:100%}
.ch{display:flex;flex-direction:column;height:100%}
.ch .top{border-bottom-color:var(--line)}
.av{width:44px;height:44px;border-radius:50%;overflow:hidden;position:relative;flex:none}
.av .ph b{font-size:22px;transform:none}
.who{flex:1;min-width:0}.who b{display:block;font:italic 600 21px/1.1 var(--display)}.who small{font-size:12.5px;font-weight:700;color:var(--dim)}
.who small.on{color:var(--online)}
.msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding-block:16px;width:100%}
.m{max-width:80%;padding:10px 14px;border-radius:18px;font-size:15px;line-height:1.45}
.m.her{align-self:flex-start;background:var(--s1);border:1px solid var(--line);border-bottom-left-radius:6px}
.m.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);font-weight:600;border-bottom-right-radius:6px}
.m.sys{align-self:center;max-width:94%;color:var(--mute);font-size:13px;text-align:center;padding:2px 8px}
.note{background:var(--s1);border:1px solid var(--line);border-radius:var(--r-ctl);padding:10px 14px;color:var(--dim);font-size:13.5px;font-weight:600}
.play{margin-top:8px;height:34px;padding:0 12px;border-radius:99px;border:1px solid var(--line);background:var(--s2);font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.m.typing{display:inline-flex;gap:5px;align-items:center;padding:14px 16px}.m.typing i{width:7px;height:7px;border-radius:50%;background:var(--dim);animation:tp 1.1s infinite}.m.typing i:nth-child(2){animation-delay:.18s}.m.typing i:nth-child(3){animation-delay:.36s}
@keyframes tp{0%,60%,100%{opacity:.3;transform:none}30%{opacity:1;transform:translateY(-3px)}}
.comp{border-top:1px solid var(--line);background:var(--bg);padding-block:10px calc(10px + env(safe-area-inset-bottom,0px))}
.comp form{display:flex;gap:8px;align-items:center}
.comp input{flex:1;min-width:0;height:48px;border-radius:24px;border:1px solid var(--line);background:var(--s1);padding:0 16px;font-weight:600;outline:0}
.comp input:focus{border-color:var(--accent)}
.send{width:48px;height:48px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;cursor:pointer;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

<div id="app"></div>

<script>

  return EN_ACCENT[h&&h.country]||'en-US'; }
const sayable=t=>String(t).replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}\u{200D}]/gu,'').replace(/\*+/g,'').trim();
function stopVoice(){ try{ if(window.QyraVoice&&QyraVoice.postMessage) QyraVoice.postMessage(JSON.stringify({stop:true})); else if(window.speechSynthesis) speechSynthesis.cancel(); }catch(e){} }
function speak(text,h){ const t=sayable(text); if(!t) return false; const lang=voiceLang(h,t);
  try{ if(window.QyraVoice&&QyraVoice.postMessage){ QyraVoice.postMessage(JSON.stringify({say:t,lang})); return true; }
    const s=window.speechSynthesis; if(!s) return false; s.cancel(); const u=new SpeechSynthesisUtterance(t); u.lang=lang; u.pitch=1.1;
    const vs=s.getVoices().filter(v=>v.lang&&v.lang.replace('_','-').toLowerCase().startsWith(lang.toLowerCase().slice(0,2)));
    const fem=vs.find(v=>/female|woman|samantha|victoria|karen|moira|tessa|veena|zira|susan|heera|google (uk english female|us english)/i.test(v.name))||vs.find(v=>v.lang.replace('_','-').toLowerCase()===lang.toLowerCase())||vs[0];
    if(fem) u.voice=fem; s.speak(u); return true; }catch(e){ return false; } }
let AI_URL='', busy={}, failed={};
const device=(()=>{ let d=store.get('device',''); if(!d){ d=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():Math.random().toString(36).slice(2)+Date.now().toString(36); store.set('device',d); } return d; })();
const lastReal=log=>{ for(let i=log.length-1;i>=0;i--) if(log[i].w!=='sys') return log[i]; return null; };
function sysOnce(log,t){ const l=log[log.length-1]; if(!l||l.t!==t) log.push({w:'sys',t}); }
const rerender=h=>{ if(location.hash==='#chat-'+h.id) chat(h); };
async function askReply(h,away){ const opener=away>0; if(!AI_URL||busy[h.id]) return; let log=getLog(h); const lr=log&&lastReal(log); if(!lr||(!opener&&lr.w!=='me')) return;
  busy[h.id]=true; rerender(h); const t0=Date.now(); let reply=null, err='';
  try{ const r=await fetch(AI_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({hostId:h.id,device,history:log.filter(m=>m.w!=='sys').slice(-24),bond:bondOf(h.id).lv,others:rivals(h.id),...(opener?{opener:true,awayHours:away}:{})})});
    const j=await r.json().catch(()=>({})); if(r.ok&&j.reply) reply=String(j.reply); else err=j.error||'ai'; }catch(e){ err='offline'; }
  const feel=Math.min(2600,700+(reply?reply.length*22:0)); await new Promise(r=>setTimeout(r,Math.max(0,feel-(Date.now()-t0))));
  busy[h.id]=false; log=getLog(h)||log;
  if(reply){ log.push({w:'her',t:reply}); delete failed[h.id]; if(voice[h.id]&&location.hash==='#chat-'+h.id) speak(reply,h); }
  else if(opener){ failed[h.id]=Date.now(); }
  else { failed[h.id]=Date.now(); sysOnce(log,err==='daily_limit'?"You've used today's free replies. Hosts can chat with you again tomorrow."
    :err==='busy'?`${h.name} is getting lots of messages. Send again in a minute.`
    :err==='offline'?`Couldn't reach ${h.name}. Check your internet, then send again.`:`${h.name} couldn't reply just now. Send your message again.`); }
  putLog(h,log); rerender(h); }
let seen=store.get('seen',{}), due={};
function chat(h){ document.documentElement.classList.add('chatmode'); let log=getLog(h);
  const now=Date.now(), last=seen[h.id]||0, awayH=(now-last)/36e5;
  if(location.hash==='#chat-'+h.id&&!busy[h.id]&&awayH>=0.1){ if(last>0&&awayH>=4&&log&&log.some(m=>m.w==='me')) due[h.id]=awayH; seen[h.id]=now; store.set('seen',seen); } if(!log){ log=[{w:'her',t:h.greeting}]; putLog(h,log); if(voice[h.id]) setTimeout(()=>speak(h.greeting,h),300); }
  if(AI_URL&&log.some(m=>m.w==='sys'&&/switch on once/.test(m.t))){ log=log.filter(m=>!(m.w==='sys'&&/switch on once/.test(m.t))); putLog(h,log); }
  const on=online(h), v=!!voice[h.id], keep=$('#msg')?$('#msg').value:'', typing=!!busy[h.id];
  $('#app').innerHTML=`<div class="ch" style="--ac:${esc(h.accent||'#f09ab0')}"><header class="top"><div class="wrap"><a class="round" href="#host-${esc(h.id)}" aria-label="Back to ${esc(h.name)}'s profile">${I.back}</a>
     <div class="av">${pic(h)}</div><div class="who"><b>${esc(h.name)}</b><small class="${on||typing?'on':''}">${typing?'typing…':esc(status(h))}</small></div><span class="tag">AI host</span></div></header>
    <div class="msgs wrap" id="msgs" aria-live="polite">
      ${on?'':`<div class="note">${esc(h.name)} is offline. She is usually online ${clock(h.from)} – ${clock(h.until)} her time, and replies when she's back.</div>`}
      ${isFav(h.id)?'':`<div class="m sys">${esc(h.name)} is not in your Favourites, so she forgets this chat when you leave.</div>`}
      ${log.map((m,i)=>`<div class="m ${m.w}">${esc(m.t)}</div>`).join('')}
      ${typing?'<div class="m her typing" aria-label="typing"><i></i><i></i><i></i></div>':''}</div>
    <div class="comp"><div class="wrap"><form id="f"><label for="msg" class="sr">Message ${esc(h.name)}</label><input id="msg" autocomplete="off" maxlength="800" placeholder="Message ${esc(h.name)}…"><button class="send" type="submit" aria-label="Send">${I.send}</button></form></div></div></div>`;
  const M=$('#msgs'); M.scrollTop=M.scrollHeight; if(keep) $('#msg').value=keep;
  $('#f').onsubmit=e=>{ e.preventDefault(); const t=$('#msg').value.trim(); if(!t) return; const L=getLog(h)||log; L.push({w:'me',t}); delete failed[h.id]; bumpBond(h.id);
    if(!AI_URL) sysOnce(L,`${h.name}'s replies switch on once Qyra's AI server is connected. Your messages are saved.`);
    else if(!online(h)) sysOnce(L,`${h.name} is offline right now. She'll reply when she's back, around ${clock(h.from)} her time.`);
    putLog(h,L); $('#msg').value=''; chat(h); setTimeout(()=>{ const i=$('#msg'); if(i) i.focus(); },0); };
  if(AI_URL&&on&&!typing&&!(failed[h.id]&&Date.now()-failed[h.id]<60000)){ const lr=lastReal(log); if(lr&&lr.w==='me') setTimeout(()=>askReply(h),0); else if(due[h.id]&&lr){ const a=due[h.id]; delete due[h.id]; setTimeout(()=>askReply(h,a),600); } } }
document.addEventListener('click',e=>{
  const q=e.target.closest('[data-quick]'); if(q){ F.quick=q.dataset.quick; saveF(); document.querySelectorAll('[data-quick]').forEach(b=>b.setAttribute('aria-pressed',b===q)); results(); return; }
  const r=e.target.closest('[data-rm]'); if(r){ const g=r.dataset.rm; if(g==='sort') F.sort='online'; else F[g]=F[g].filter(x=>x!==r.dataset.k); saveF(); results(); return; }
  if(e.target.closest('#clearall,#reset')){ F.ages=[];F.countries=[];F.figures=[];F.sort='online';F.quick='all';F.q=''; saveF(); discover(); return; }
  if(e.target.closest('#fopen')) sheet(); });

const BONDS=[['Strangers',0,0],['Getting to know',8,1],['Close',30,2],['Crush',80,3],['In love',160,5]];
const bondData=id=>{ const b=store.get('bond',{}); return b[id]||{n:0,d:[]}; };
function bondOf(id){ const b=bondData(id); let lv=0; BONDS.forEach((x,i)=>{ if(b.n>=x[1]&&b.d.length>=x[2]) lv=i; });
  const nx=BONDS[lv+1]; const pr=nx?Math.min(1,Math.min(b.n/nx[1],nx[2]?b.d.length/nx[2]:1)):1; return {lv:lv+1,name:BONDS[lv][0],pr,next:nx&&nx[0]}; }
function bumpBond(id){ const all=store.get('bond',{}); const b=all[id]||{n:0,d:[]}; b.n++; const day=new Date().toISOString().slice(0,10);
  if(!b.d.includes(day)) b.d=[...b.d,day].slice(-30); b.t=Date.now(); all[id]=b; store.set('bond',all); }
function rivals(id){ const all=store.get('bond',{}), cut=Date.now()-36*36e5;
  return Object.keys(all).filter(k=>k!==id&&all[k].t>cut).sort((a,b)=>all[b].t-all[a].t).slice(0,3).map(k=>{ const x=HOSTS.find(h=>h.id===k); return x&&x.name; }).filter(Boolean); }
const heartsHtml=lv=>`<span class="hs" aria-hidden="true">${[1,2,3,4,5].map(i=>`<svg viewBox="0 0 24 24" class="${i<=lv?'':'off'}"><path fill="currentColor" d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.1 0 3.5 1.1 4.3 2.4.8-1.3 2.2-2.4 4.3-2.4 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z"/></svg>`).join('')}</span>`;
function gate(){ document.documentElement.classList.remove('chatmode');
  $('#app').innerHTML=`<div class="gate"><div class="in"><svg class="crown" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 10H5L3 8z" fill="currentColor"/></svg>
    <h1>Qyra<span>.</span></h1><span class="age">18+ ONLY</span>
    <p>Qyra is for adults. Its AI hosts flirt, tease and talk about love and relationships. They are AI characters, not real people.</p>
    <button class="btn pri" type="button" id="g-yes">I'm 18 or older, enter</button><button class="btn" type="button" id="g-no">I'm under 18</button></div></div>`;
  $('#g-yes').onclick=()=>{ store.set('adult',Date.now()); route(); };
  $('#g-no').onclick=()=>{ $('#app').innerHTML=`<div class="gate"><div class="in"><h1>Qyra<span>.</span></h1><p>Sorry, Qyra is only for adults. Please close the app.</p></div></div>`; }; }
function route(){ const hs=location.hash.slice(1); let m; if(!store.get('adult',0)) return gate(); if(!/^chat-/.test(hs)) stopVoice(); document.documentElement.classList.remove('locked'); const sc=$('#scrim'); if(sc) sc.remove();
  if(hs==='favourites'){ F.quick='favs'; saveF(); history.replaceState(null,'',location.pathname+location.search); return discover(); }
  if((m=hs.match(/^host-(.+)$/))){ const h=HOSTS.find(x=>x.id===m[1]); if(h){ window.scrollTo(0,0); return profile(h); } }
  if((m=hs.match(/^chat-(.+)$/))){ const h=HOSTS.find(x=>x.id===m[1]); if(h) return chat(h); }
  discover(); }
window.addEventListener('hashchange',route);
setInterval(()=>{ if(!location.hash&&!$('#scrim')&&document.activeElement!==$('#q')) results(); },60000);
(async()=>{ HOSTS=SAMPLE; route();
  try{ const c=await fetch('qyra-config.json',{cache:'no-store'}); if(c.ok){ const j=await c.json(); if(j&&typeof j.aiUrl==='string'&&/^https:\/\//.test(j.aiUrl)) AI_URL=j.aiUrl; } }catch(e){}
  try{ const r=await fetch('hosts.json',{cache:'no-store'}); if(r.ok){ const j=await r.json(); if(Array.isArray(j.hosts)&&j.hosts.length){ HOSTS=j.hosts.filter(h=>h.age>=18); route(); } } }catch(e){} })();
</script>
